name: ECS GitOps Pipeline (With Stages)

on:
  repository_dispatch:
    types: [create-ecs-cluster, delete-ecs-cluster, update-ecs-cluster, create-asg, delete-asg]

permissions:
  contents: write

jobs:
  # STAGE 1: Validate
  validate:
    name: "Stage 1: Validate"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      
      - name: Validate Input
        run: |
          echo "Validating cluster name: ${{ github.event.client_payload.clusterName }}"
          echo "Capacity provider: ${{ github.event.client_payload.capacityProvider }}"
  
  # STAGE 2: Build Configuration
  build:
    name: "Stage 2: Build Config"
    runs-on: ubuntu-latest
    needs: validate  # Wait for validate stage to complete
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      
      - name: Create ASG Config
        if: github.event.action == 'create-asg'
        run: |
          ASG_NAME="${{ github.event.client_payload.asgName }}"
          INSTANCE_TYPE="${{ github.event.client_payload.instanceType }}"
          MIN_SIZE="${{ github.event.client_payload.minSize }}"
          MAX_SIZE="${{ github.event.client_payload.maxSize }}"
          DESIRED="${{ github.event.client_payload.desiredCapacity }}"
          CLUSTER_NAME="${{ github.event.client_payload.clusterName }}"
          SAFE_NAME=$(echo "$ASG_NAME" | tr '-' '_')
          
          cat >> ecs-asg.tf << EOF
          
          data "aws_ami" "ecs_optimized_${SAFE_NAME}" {
            most_recent = true
            owners      = ["amazon"]
            filter {
              name   = "name"
              values = ["amzn2-ami-ecs-hvm-*-x86_64-ebs"]
            }
          }
          
          resource "aws_launch_template" "ecs_lt_${SAFE_NAME}" {
            name_prefix   = "${ASG_NAME}-"
            image_id      = data.aws_ami.ecs_optimized_${SAFE_NAME}.id
            instance_type = "${INSTANCE_TYPE}"
            
            iam_instance_profile {
              name = aws_iam_instance_profile.ecs_instance_profile_${SAFE_NAME}.name
            }
            
            user_data = base64encode(<<-EOF
              #!/bin/bash
              echo ECS_CLUSTER=${CLUSTER_NAME} >> /etc/ecs/ecs.config
            EOF
            )
            
            tag_specifications {
              resource_type = "instance"
              tags = {
                Name = "${ASG_NAME}-instance"
                ManagedBy = "K8s-GitOps"
              }
            }
          }
          
          resource "aws_autoscaling_group" "ecs_asg_${SAFE_NAME}" {
            name                = "${ASG_NAME}"
            min_size            = ${MIN_SIZE}
            max_size            = ${MAX_SIZE}
            desired_capacity    = ${DESIRED}
            vpc_zone_identifier = ["subnet-0315f97df3d9be14d", "subnet-0fbcaf451e77e245d"]
            
            launch_template {
              id      = aws_launch_template.ecs_lt_${SAFE_NAME}.id
              version = "\$Latest"
            }
            
            tag {
              key                 = "Name"
              value               = "${ASG_NAME}"
              propagate_at_launch = true
            }
            
            tag {
              key                 = "AmazonECSManaged"
              value               = "true"
              propagate_at_launch = true
            }
          }
          
          resource "aws_iam_role" "ecs_instance_role_${SAFE_NAME}" {
            name = "${ASG_NAME}-instance-role"
            
            assume_role_policy = jsonencode({
              Version = "2012-10-17"
              Statement = [{
                Action = "sts:AssumeRole"
                Effect = "Allow"
                Principal = {
                  Service = "ec2.amazonaws.com"
                }
              }]
            })
          }
          
          resource "aws_iam_role_policy_attachment" "ecs_instance_role_policy_${SAFE_NAME}" {
            role       = aws_iam_role.ecs_instance_role_${SAFE_NAME}.name
            policy_arn = "arn:aws:iam::aws:policy/service-role/AmazonEC2ContainerServiceforEC2Role"
          }
          
          resource "aws_iam_instance_profile" "ecs_instance_profile_${SAFE_NAME}" {
            name = "${ASG_NAME}-instance-profile"
            role = aws_iam_role.ecs_instance_role_${SAFE_NAME}.name
          }
          EOF
      
      - name: Create Cluster Config
        if: github.event.action == 'create-ecs-cluster'
        run: |
          CLUSTER_NAME="${{ github.event.client_payload.clusterName }}"
          CAPACITY="${{ github.event.client_payload.capacityProvider }}"
          INSIGHTS="${{ github.event.client_payload.containerInsights }}"
          SAFE_NAME=$(echo "$CLUSTER_NAME" | tr '-' '_')
          
          if [ "${CAPACITY}" == "EC2" ]; then
            cat >> ecs-clusters.tf << EOF
          
          resource "aws_ecs_cluster" "cluster_${SAFE_NAME}" {
            name = "${CLUSTER_NAME}"
            
            setting {
              name  = "containerInsights"
              value = "${INSIGHTS}"
            }
            
            tags = {
              Name = "${CLUSTER_NAME}"
              ManagedBy = "K8s-GitOps"
              CreatedBy = "${{ github.event.client_payload.user }}"
            }
          }
          
          resource "aws_ecs_capacity_provider" "cluster_${SAFE_NAME}_cp" {
            name = "${CLUSTER_NAME}-capacity-provider"
            
            auto_scaling_group_provider {
              auto_scaling_group_arn         = aws_autoscaling_group.ecs_asg_${SAFE_NAME}.arn
              managed_termination_protection = "${{ github.event.client_payload.terminationProtection || 'DISABLED' }}"
              
              managed_scaling {
                status                    = "ENABLED"
                target_capacity           = ${{ github.event.client_payload.targetCapacity || 80 }}
                maximum_scaling_step_size = ${{ github.event.client_payload.maxScalingStep || 10 }}
                minimum_scaling_step_size = ${{ github.event.client_payload.minScalingStep || 1 }}
              }
            }
          }
          
          resource "aws_ecs_cluster_capacity_providers" "cluster_${SAFE_NAME}_assoc" {
            cluster_name       = aws_ecs_cluster.cluster_${SAFE_NAME}.name
            capacity_providers = [aws_ecs_capacity_provider.cluster_${SAFE_NAME}_cp.name]
            
            default_capacity_provider_strategy {
              capacity_provider = aws_ecs_capacity_provider.cluster_${SAFE_NAME}_cp.name
              weight            = 1
            }
          }
          EOF
          else
            cat >> ecs-clusters.tf << EOF
          
          resource "aws_ecs_cluster" "cluster_${SAFE_NAME}" {
            name = "${CLUSTER_NAME}"
            
            setting {
              name  = "containerInsights"
              value = "${INSIGHTS}"
            }
            
            tags = {
              Name = "${CLUSTER_NAME}"
              ManagedBy = "K8s-GitOps"
              CreatedBy = "${{ github.event.client_payload.user }}"
            }
          }
          EOF
          fi
      
      - name: Delete ASG Config
        if: github.event.action == 'delete-asg'
        run: |
          ASG_NAME="${{ github.event.client_payload.asgName }}"
          SAFE_NAME=$(echo "$ASG_NAME" | tr '-' '_')
          
          python3 << 'PYTHON_SCRIPT'
          import re
          import sys
          
          safe_name = "$SAFE_NAME"
          
          with open('ecs-asg.tf', 'r') as f:
              content = f.read()
          
          # Remove all resource blocks containing the safe_name
          patterns = [
              rf'data "aws_ami" "ecs_optimized_{safe_name}".*?\n}}',
              rf'resource "aws_launch_template" "ecs_lt_{safe_name}".*?\n}}',
              rf'resource "aws_autoscaling_group" "ecs_asg_{safe_name}".*?\n}}',
              rf'resource "aws_iam_role" "ecs_instance_role_{safe_name}".*?\n}}',
              rf'resource "aws_iam_role_policy_attachment" "ecs_instance_role_policy_{safe_name}".*?\n}}',
              rf'resource "aws_iam_instance_profile" "ecs_instance_profile_{safe_name}".*?\n}}'
          ]
          
          for pattern in patterns:
              content = re.sub(pattern, '', content, flags=re.DOTALL)
          
          # Clean up extra blank lines
          content = re.sub(r'\n{3,}', '\n\n', content)
          
          with open('ecs-asg.tf', 'w') as f:
              f.write(content)
          PYTHON_SCRIPT
      
      - name: Update Cluster Config
        if: github.event.action == 'update-ecs-cluster'
        run: |
          CLUSTER_NAME="${{ github.event.client_payload.clusterName }}"
          INSIGHTS="${{ github.event.client_payload.containerInsights }}"
          SAFE_NAME=$(echo "$CLUSTER_NAME" | tr '-' '_')
          sed -i "/resource \"aws_ecs_cluster\" \"cluster_${SAFE_NAME}\"/,/^  }/s/value = \".*\"/value = \"${INSIGHTS}\"/" ecs-clusters.tf
      
      - name: Delete Cluster Config
        if: github.event.action == 'delete-ecs-cluster'
        run: |
          CLUSTER_NAME="${{ github.event.client_payload.clusterName }}"
          SAFE_NAME=$(echo "$CLUSTER_NAME" | tr '-' '_')
          
          # Use awk to properly delete resource blocks
          awk -v cluster="cluster_${SAFE_NAME}" '
            /^resource "aws_ecs_cluster" / { 
              if ($0 ~ cluster) { skip=1; next } 
            }
            /^resource "aws_ecs_cluster_capacity_providers" / { 
              if ($0 ~ cluster) { skip=1; next } 
            }
            /^}$/ { 
              if (skip) { skip=0; next } 
            }
            !skip
          ' ecs-clusters.tf > ecs-clusters.tf.tmp && mv ecs-clusters.tf.tmp ecs-clusters.tf
      
      - name: Commit Changes
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          git config user.name "K8s Platform Bot"
          git config user.email "platform@k8s.local"
          git add ecs-clusters.tf ecs-asg.tf
          
          if [ "${{ github.event.action }}" == "create-ecs-cluster" ]; then
            git commit -m "Platform: Create ECS cluster ${{ github.event.client_payload.clusterName }}"
          elif [ "${{ github.event.action }}" == "update-ecs-cluster" ]; then
            git commit -m "Platform: Update ECS cluster ${{ github.event.client_payload.clusterName }}"
          elif [ "${{ github.event.action }}" == "create-asg" ]; then
            git commit -m "Platform: Create ASG ${{ github.event.client_payload.asgName }}"
          elif [ "${{ github.event.action }}" == "delete-asg" ]; then
            git commit -m "Platform: Delete ASG ${{ github.event.client_payload.asgName }}"
          else
            git commit -m "Platform: Delete ECS cluster ${{ github.event.client_payload.clusterName }}"
          fi
          
          git push https://$GH_TOKEN@github.com/${{ github.repository }}.git
  
  # STAGE 3: Plan Infrastructure
  plan:
    name: "Stage 3: Terraform Plan"
    runs-on: ubuntu-latest
    needs: build  # Wait for build stage to complete
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.repository.default_branch }}
      
      - name: Pull Latest Changes
        run: git pull origin ${{ github.event.repository.default_branch }}
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
      
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      
      - name: Terraform Init
        run: terraform init
      
      - name: Terraform Plan
        run: terraform plan -out=tfplan
      
      - name: Upload Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: tfplan
  
  # STAGE 4: Deploy to AWS
  deploy:
    name: "Stage 4: Deploy to AWS"
    runs-on: ubuntu-latest
    needs: plan  # Wait for plan stage to complete
    environment: production  # Requires approval in GitHub settings
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.repository.default_branch }}
      
      - name: Pull Latest Changes
        run: git pull origin ${{ github.event.repository.default_branch }}
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
      
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      
      - name: Terraform Init
        run: terraform init
      
      - name: Download Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
      
      - name: Remove Deleted ASG from State
        if: github.event.action == 'delete-asg'
        run: |
          ASG_NAME="${{ github.event.client_payload.asgName }}"
          SAFE_NAME=$(echo "$ASG_NAME" | tr '-' '_')
          
          terraform state rm "data.aws_ami.ecs_optimized_${SAFE_NAME}" || true
          terraform state rm "aws_launch_template.ecs_lt_${SAFE_NAME}" || true
          terraform state rm "aws_autoscaling_group.ecs_asg_${SAFE_NAME}" || true
          terraform state rm "aws_iam_role.ecs_instance_role_${SAFE_NAME}" || true
          terraform state rm "aws_iam_role_policy_attachment.ecs_instance_role_policy_${SAFE_NAME}" || true
          terraform state rm "aws_iam_instance_profile.ecs_instance_profile_${SAFE_NAME}" || true
      
      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
  
  # STAGE 5: Verify
  verify:
    name: "Stage 5: Verify Deployment"
    runs-on: ubuntu-latest
    needs: deploy  # Wait for deploy stage to complete
    steps:
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      
      - name: Verify Cluster
        run: |
          CLUSTER_NAME="${{ github.event.client_payload.clusterName }}"
          aws ecs describe-clusters --clusters $CLUSTER_NAME
          echo "✅ Cluster verified successfully!"
