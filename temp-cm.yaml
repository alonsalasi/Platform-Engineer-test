apiVersion: v1
data:
  index.html: "<!DOCTYPE html>\n<html>\n<head>\n    <meta charset=\"UTF-8\">\n    <meta
    name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>ECS
    Platform Manager</title>\n    <style>\n        * { margin: 0; padding: 0; box-sizing:
    border-box; }\n        body {\n            font-family: 'Segoe UI', Tahoma, Geneva,
    Verdana, sans-serif;\n            background: linear-gradient(135deg, #667eea
    0%, #764ba2 100%);\n            min-height: 100vh;\n            padding: 20px;\n
    \       }\n        .container {\n            max-width: 1200px;\n            margin:
    0 auto;\n        }\n        .header {\n            background: rgba(255, 255,
    255, 0.95);\n            backdrop-filter: blur(10px);\n            border-radius:
    20px;\n            padding: 30px;\n            margin-bottom: 30px;\n            box-shadow:
    0 20px 60px rgba(0,0,0,0.3);\n            display: flex;\n            justify-content:
    space-between;\n            align-items: center;\n        }\n        .header h1
    {\n            font-size: 2.5em;\n            background: linear-gradient(135deg,
    #667eea 0%, #764ba2 100%);\n            -webkit-background-clip: text;\n            -webkit-text-fill-color:
    transparent;\n            display: flex;\n            align-items: center;\n            gap:
    15px;\n        }\n        .badge {\n            background: linear-gradient(135deg,
    #11998e 0%, #38ef7d 100%);\n            color: white;\n            padding: 8px
    16px;\n            border-radius: 20px;\n            font-size: 0.9em;\n            font-weight:
    600;\n            box-shadow: 0 4px 15px rgba(17, 153, 142, 0.4);\n        }\n
    \       .card {\n            background: rgba(255, 255, 255, 0.95);\n            backdrop-filter:
    blur(10px);\n            border-radius: 20px;\n            padding: 30px;\n            margin-bottom:
    30px;\n            box-shadow: 0 20px 60px rgba(0,0,0,0.3);\n            transition:
    transform 0.3s ease, box-shadow 0.3s ease;\n        }\n        .card:hover {\n
    \           transform: translateY(-5px);\n            box-shadow: 0 25px 70px
    rgba(0,0,0,0.4);\n        }\n        .card h2 {\n            color: #333;\n            margin-bottom:
    20px;\n            font-size: 1.8em;\n            display: flex;\n            align-items:
    center;\n            gap: 10px;\n        }\n        .form-grid {\n            display:
    grid;\n            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));\n
    \           gap: 20px;\n            margin-bottom: 20px;\n        }\n        .form-group
    {\n            display: flex;\n            flex-direction: column;\n        }\n
    \       label {\n            color: #555;\n            font-weight: 600;\n            margin-bottom:
    8px;\n            font-size: 0.9em;\n            text-transform: uppercase;\n
    \           letter-spacing: 0.5px;\n        }\n        input, select {\n            padding:
    12px 16px;\n            border: 2px solid #e0e0e0;\n            border-radius:
    10px;\n            font-size: 1em;\n            transition: all 0.3s ease;\n            background:
    white;\n        }\n        input:focus, select:focus {\n            outline: none;\n
    \           border-color: #667eea;\n            box-shadow: 0 0 0 3px rgba(102,
    126, 234, 0.1);\n        }\n        .btn {\n            padding: 14px 28px;\n
    \           border: none;\n            border-radius: 10px;\n            font-size:
    1em;\n            font-weight: 600;\n            cursor: pointer;\n            transition:
    all 0.3s ease;\n            text-transform: uppercase;\n            letter-spacing:
    0.5px;\n            box-shadow: 0 4px 15px rgba(0,0,0,0.2);\n        }\n        .btn:hover
    {\n            transform: translateY(-2px);\n            box-shadow: 0 6px 20px
    rgba(0,0,0,0.3);\n        }\n        .btn-primary {\n            background: linear-gradient(135deg,
    #667eea 0%, #764ba2 100%);\n            color: white;\n        }\n        .btn-refresh
    {\n            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);\n
    \           color: white;\n        }\n        .btn-edit {\n            background:
    linear-gradient(135deg, #f093fb 0%, #f5576c 100%);\n            color: white;\n
    \           padding: 8px 16px;\n            font-size: 0.85em;\n        }\n        .btn-delete
    {\n            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);\n
    \           color: white;\n            padding: 8px 16px;\n            font-size:
    0.85em;\n        }\n        .alert {\n            padding: 20px 24px;\n            border-radius:
    15px;\n            margin-bottom: 15px;\n            font-weight: 600;\n            font-size:
    1.1em;\n            animation: slideInBounce 0.5s ease;\n            box-shadow:
    0 8px 30px rgba(0,0,0,0.3);\n            border: 3px solid rgba(255,255,255,0.3);\n
    \           backdrop-filter: blur(10px);\n        }\n        @keyframes slideInBounce
    {\n            0% { transform: translateX(400px) scale(0.5); opacity: 0; }\n            60%
    { transform: translateX(-20px) scale(1.05); opacity: 1; }\n            100% {
    transform: translateX(0) scale(1); opacity: 1; }\n        }\n        .alert-success
    {\n            background: linear-gradient(135deg, #00b894 0%, #00ff88 100%);\n
    \           color: white;\n            text-shadow: 0 2px 4px rgba(0,0,0,0.2);\n
    \       }\n        .alert-error {\n            background: linear-gradient(135deg,
    #ff3838 0%, #ff6b6b 100%);\n            color: white;\n            text-shadow:
    0 2px 4px rgba(0,0,0,0.2);\n        }\n        table {\n            width: 100%;\n
    \           border-collapse: separate;\n            border-spacing: 0;\n            margin-top:
    20px;\n        }\n        th {\n            background: linear-gradient(135deg,
    #667eea 0%, #764ba2 100%);\n            color: white;\n            padding: 16px;\n
    \           text-align: left;\n            font-weight: 600;\n            text-transform:
    uppercase;\n            font-size: 0.85em;\n            letter-spacing: 0.5px;\n
    \       }\n        th:first-child { border-radius: 10px 0 0 0; }\n        th:last-child
    { border-radius: 0 10px 0 0; }\n        td {\n            padding: 16px;\n            border-bottom:
    1px solid #f0f0f0;\n            background: white;\n        }\n        tr:last-child
    td:first-child { border-radius: 0 0 0 10px; }\n        tr:last-child td:last-child
    { border-radius: 0 0 10px 0; }\n        tr:hover td {\n            background:
    #f8f9ff;\n        }\n        .actions {\n            display: flex;\n            gap:
    10px;\n        }\n        .empty-state {\n            text-align: center;\n            padding:
    60px 20px;\n            color: #999;\n            font-size: 1.2em;\n        }\n
    \       .loading {\n            display: inline-block;\n            width: 20px;\n
    \           height: 20px;\n            border: 3px solid rgba(255,255,255,0.3);\n
    \           border-radius: 50%;\n            border-top-color: white;\n            animation:
    spin 1s ease-in-out infinite;\n        }\n        @keyframes spin {\n            to
    { transform: rotate(360deg); }\n        }\n    </style>\n</head>\n<body>\n    <div
    class=\"container\">\n        <div class=\"header\">\n            <h1>\U0001F680
    ECS Platform Manager</h1>\n            <span class=\"badge\">Kubernetes IDP</span>\n
    \       </div>\n        \n        <div id=\"alerts\" style=\"position:fixed; top:20px;
    right:20px; z-index:2000; max-width:400px;\"></div>\n        \n        <div class=\"card\">\n
    \           <h2>\U0001F4CA Active Clusters</h2>\n            <button onclick=\"loadClusters()\"
    class=\"btn btn-refresh\">\U0001F504 Refresh</button>\n            <div id=\"clustersList\"></div>\n
    \       </div>\n        \n        <div class=\"card\">\n            <h2>➕ Create
    ECS Cluster</h2>\n            <div class=\"form-grid\">\n                <div
    class=\"form-group\">\n                    <label>Cluster Name</label>\n                    <input
    type=\"text\" id=\"clusterName\" placeholder=\"my-production-cluster\">\n                </div>\n
    \               <div class=\"form-group\">\n                    <label>Capacity
    Provider</label>\n                    <select id=\"capacityProvider\" onchange=\"toggleASGSection()\">\n
    \                       <option value=\"FARGATE\">AWS Fargate</option>\n                        <option
    value=\"FARGATE_SPOT\">Fargate Spot</option>\n                        <option
    value=\"EC2\">EC2 Instances</option>\n                    </select>\n                </div>\n
    \               <div class=\"form-group\">\n                    <label>Container
    Insights</label>\n                    <select id=\"containerInsights\">\n                        <option
    value=\"disabled\">Disabled (Free)</option>\n                        <option value=\"enabled\">Enabled
    (Paid)</option>\n                    </select>\n                </div>\n            </div>\n
    \           \n            <div id=\"asgSection\" style=\"display:none; margin-top:20px;\">\n
    \               <div class=\"form-group\">\n                    <label>Select
    Auto Scaling Group</label>\n                    <select id=\"asgChoice\" style=\"width:100%;\">\n
    \                       <option value=\"\">Loading ASGs...</option>\n                    </select>\n
    \                   <button onclick=\"loadASGs()\" class=\"btn btn-refresh\" style=\"margin-top:10px;
    padding:8px 16px; font-size:0.9em;\">\U0001F504 Refresh ASG List</button>\n                </div>\n
    \               \n                <h3 style=\"color:#333; font-size:1.1em; margin:20px
    0 15px 0; padding-top:20px; border-top:2px solid #e0e0e0;\">Capacity Provider
    Settings *</h3>\n                <div class=\"form-grid\">\n                    <div
    class=\"form-group\">\n                        <label>Target Capacity (%) *</label>\n
    \                       <input type=\"number\" id=\"clusterTargetCapacity\" value=\"80\"
    min=\"1\" max=\"100\" required>\n                    </div>\n                    <div
    class=\"form-group\">\n                        <label>Max Scaling Step *</label>\n
    \                       <input type=\"number\" id=\"clusterMaxScalingStep\" value=\"10\"
    min=\"1\" max=\"100\" required>\n                    </div>\n                    <div
    class=\"form-group\">\n                        <label>Min Scaling Step *</label>\n
    \                       <input type=\"number\" id=\"clusterMinScalingStep\" value=\"1\"
    min=\"1\" max=\"10\" required>\n                    </div>\n                </div>\n
    \               <div class=\"form-group\" style=\"margin-top:10px;\">\n                    <label>Termination
    Protection *</label>\n                    <select id=\"clusterTerminationProtection\"
    required>\n                        <option value=\"DISABLED\">Disabled (Allow
    scale-down)</option>\n                        <option value=\"ENABLED\">Enabled
    (Prevent termination)</option>\n                    </select>\n                </div>\n
    \           </div>\n            \n            <button onclick=\"createCluster()\"
    class=\"btn btn-primary\" style=\"margin-top:20px;\">\U0001F680 Deploy Cluster
    via GitOps</button>\n        </div>\n        \n        <div class=\"card\">\n
    \           <h2>➕ Create Auto Scaling Group</h2>\n            <p style=\"color:#666;
    margin-bottom:20px;\">Create ASGs for EC2-based ECS clusters.</p>\n            \n
    \           <div class=\"form-grid\">\n                <div class=\"form-group\">\n
    \                   <label>ASG Name</label>\n                    <input type=\"text\"
    id=\"asgName\" placeholder=\"my-ecs-asg\">\n                </div>\n                <div
    class=\"form-group\">\n                    <label>Instance Type</label>\n                    <select
    id=\"instanceType\">\n                        <option value=\"t3.micro\">t3.micro
    (2 vCPU, 1GB RAM)</option>\n                        <option value=\"t3.small\">t3.small
    (2 vCPU, 2GB RAM)</option>\n                        <option value=\"t3.medium\">t3.medium
    (2 vCPU, 4GB RAM)</option>\n                        <option value=\"t3.large\">t3.large
    (2 vCPU, 8GB RAM)</option>\n                    </select>\n                </div>\n
    \           </div>\n            \n            <div class=\"form-grid\" style=\"margin-top:10px;\">\n
    \               <div class=\"form-group\">\n                    <label>Min Size</label>\n
    \                   <input type=\"number\" id=\"minSize\" value=\"1\" min=\"0\"
    max=\"10\">\n                </div>\n                <div class=\"form-group\">\n
    \                   <label>Max Size</label>\n                    <input type=\"number\"
    id=\"maxSize\" value=\"3\" min=\"1\" max=\"10\">\n                </div>\n                <div
    class=\"form-group\">\n                    <label>Desired Capacity</label>\n                    <input
    type=\"number\" id=\"desiredCapacity\" value=\"2\" min=\"0\" max=\"10\">\n                </div>\n
    \           </div>\n            \n            <h3 style=\"color:#333; font-size:1.1em;
    margin:25px 0 15px 0; padding-top:20px; border-top:2px solid #e0e0e0;\">Capacity
    Provider Settings</h3>\n            <p style=\"color:#666; font-size:0.9em; margin-bottom:15px;\">Configure
    auto-scaling behavior for ECS tasks</p>\n            \n            <div class=\"form-grid\">\n
    \               <div class=\"form-group\">\n                    <label>Target
    Capacity (%) *</label>\n                    <input type=\"number\" id=\"targetCapacity\"
    value=\"80\" min=\"1\" max=\"100\" required>\n                    <small style=\"color:#999;
    font-size:0.85em;\">Keep instances at this % utilization</small>\n                </div>\n
    \               <div class=\"form-group\">\n                    <label>Max Scaling
    Step *</label>\n                    <input type=\"number\" id=\"maxScalingStep\"
    value=\"10\" min=\"1\" max=\"100\" required>\n                    <small style=\"color:#999;
    font-size:0.85em;\">Max instances to add at once</small>\n                </div>\n
    \               <div class=\"form-group\">\n                    <label>Min Scaling
    Step *</label>\n                    <input type=\"number\" id=\"minScalingStep\"
    value=\"1\" min=\"1\" max=\"10\" required>\n                    <small style=\"color:#999;
    font-size:0.85em;\">Min instances to add at once</small>\n                </div>\n
    \           </div>\n            \n            <div class=\"form-group\" style=\"margin-top:10px;\">\n
    \               <label>Termination Protection</label>\n                <select
    id=\"terminationProtection\">\n                    <option value=\"DISABLED\">Disabled
    (Allow scale-down)</option>\n                    <option value=\"ENABLED\">Enabled
    (Prevent termination)</option>\n                </select>\n            </div>\n
    \           \n            <button onclick=\"createASG()\" class=\"btn btn-primary\"
    style=\"margin-top:20px;\">\U0001F680 Create ASG via GitOps</button>\n            \n
    \           <div id=\"asgProgress\" style=\"display:none; margin-top:20px; padding:20px;
    background:linear-gradient(135deg, #667eea 0%, #764ba2 100%); border-radius:10px;
    color:white;\">\n                <h4 style=\"margin-bottom:10px;\">⏳ Creating
    Auto Scaling Group...</h4>\n                <div id=\"asgStatus\" style=\"font-size:1.1em;
    font-weight:500;\"></div>\n                <div style=\"margin-top:10px; font-size:0.9em;
    opacity:0.9;\">\U0001F552 This may take 2-5 minutes. Progress updates every 5
    seconds.</div>\n            </div>\n        </div>\n        \n        <div class=\"card\">\n
    \           <h2>\U0001F5D1️ Delete Auto Scaling Group</h2>\n            <p style=\"color:#666;
    margin-bottom:20px;\">Remove existing ASGs and terminate all EC2 instances.</p>\n
    \           <div style=\"display:flex; gap:10px; align-items:flex-end;\">\n                <div
    class=\"form-group\" style=\"flex:1;\">\n                    <label>Select ASG
    to Delete</label>\n                    <select id=\"asgDeleteChoice\" style=\"width:100%;\">\n
    \                       <option value=\"\">Loading ASGs...</option>\n                    </select>\n
    \               </div>\n                <button onclick=\"deleteASG()\" class=\"btn
    btn-delete\" style=\"padding:12px 24px;\">\U0001F5D1️ Delete ASG</button>\n            </div>\n
    \       </div>\n    </div>\n    \n    <div id=\"editModal\" style=\"display:none;
    position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7);
    z-index:1000; align-items:center; justify-content:center;\">\n        <div style=\"background:white;
    border-radius:20px; padding:40px; max-width:500px; width:90%; box-shadow:0 20px
    60px rgba(0,0,0,0.5);\">\n            <h2 style=\"margin-bottom:20px; color:#333;\">✏️
    Edit Cluster Settings</h2>\n            <p style=\"color:#666; margin-bottom:20px;\">Cluster:
    <strong id=\"editClusterName\"></strong></p>\n            <div class=\"form-group\">\n
    \               <label>Container Insights</label>\n                <select id=\"editInsights\"
    style=\"width:100%;\">\n                    <option value=\"disabled\">Disabled
    (Free)</option>\n                    <option value=\"enabled\">Enabled (Paid)</option>\n
    \               </select>\n            </div>\n            <div style=\"display:flex;
    gap:10px; margin-top:30px;\">\n                <button onclick=\"applyEdit()\"
    class=\"btn btn-primary\" style=\"flex:1;\">✔️ Apply Changes</button>\n                <button
    onclick=\"closeEditModal()\" class=\"btn\" style=\"flex:1; background:#e0e0e0;
    color:#333;\">❌ Cancel</button>\n            </div>\n        </div>\n    </div>\n
    \   \n    <script>\n        async function loadClusters() {\n            const
    list = document.getElementById('clustersList');\n            list.innerHTML =
    '<div class=\"empty-state\"><div class=\"loading\"></div> Refreshing clusters...</div>';\n
    \           \n            try {\n                const response = await fetch('/api/ecs/list');\n
    \               const data = await response.json();\n                \n                if
    (data.clusters && data.clusters.length > 0) {\n                    list.innerHTML
    = '<table><thead><tr><th>Cluster Name</th><th>Status</th><th>Running Tasks</th><th>Pending
    Tasks</th><th>Actions</th></tr></thead><tbody>' +\n                        data.clusters.map(c
    => `<tr><td><strong>${c.name}</strong></td><td>${c.status}</td><td>${c.runningTasks}</td><td>${c.pendingTasks}</td><td><div
    class=\"actions\"><button onclick=\"editCluster('${c.name}')\" class=\"btn btn-edit\">✏️
    Edit</button><button onclick=\"deleteCluster('${c.name}')\" class=\"btn btn-delete\">\U0001F5D1️
    Delete</button></div></td></tr>`).join('') +\n                        '</tbody></table>';\n
    \               } else {\n                    list.innerHTML = '<div class=\"empty-state\">\U0001F4E6
    No clusters found. Create your first cluster below!</div>';\n                }\n
    \           } catch (error) {\n                list.innerHTML = '<p style=\"color:red;\">Error
    loading clusters</p>';\n            }\n        }\n        \n        window.onload
    = () => {\n            loadClusters();\n            loadASGs();\n        };\n
    \       \n        let asgData = [];\n        \n        async function loadASGs()
    {\n            try {\n                const response = await fetch('/api/asg/list');\n
    \               const data = await response.json();\n                asgData =
    data.asgs || [];\n                const select = document.getElementById('asgChoice');\n
    \               const deleteSelect = document.getElementById('asgDeleteChoice');\n
    \               \n                if (asgData.length > 0) {\n                    const
    options = asgData.map(a => `<option value=\"${a.name}\">${a.name} (${a.instances}
    instances)</option>`).join('');\n                    select.innerHTML = '<option
    value=\"\">-- Select Existing ASG --</option>' + options;\n                    deleteSelect.innerHTML
    = '<option value=\"\">-- Select ASG to Delete --</option>' + options;\n                    select.onchange
    = () => fillCapacityProviderSettings();\n                } else {\n                    select.innerHTML
    = '<option value=\"\">No ASGs available - Create one below</option>';\n                    deleteSelect.innerHTML
    = '<option value=\"\">No ASGs available</option>';\n                }\n                \n
    \           } catch (error) {\n                const select = document.getElementById('asgChoice');\n
    \               const deleteSelect = document.getElementById('asgDeleteChoice');\n
    \               select.innerHTML = '<option value=\"\">⚠️ Error loading ASGs</option>';\n
    \               deleteSelect.innerHTML = '<option value=\"\">⚠️ Error loading
    ASGs</option>';\n            }\n        }\n        \n        function fillCapacityProviderSettings()
    {\n            const asgName = document.getElementById('asgChoice').value;\n            const
    asg = asgData.find(a => a.name === asgName);\n            if (asg) {\n                document.getElementById('clusterTargetCapacity').value
    = asg.targetCapacity;\n                document.getElementById('clusterMaxScalingStep').value
    = asg.maxScalingStep;\n                document.getElementById('clusterMinScalingStep').value
    = asg.minScalingStep;\n                document.getElementById('clusterTerminationProtection').value
    = asg.terminationProtection;\n            }\n        }\n        \n        function
    toggleASGSection() {\n            const provider = document.getElementById('capacityProvider').value;\n
    \           const section = document.getElementById('asgSection');\n            \n
    \           if (provider === 'EC2') {\n                section.style.display =
    'block';\n                loadASGs();\n            } else {\n                section.style.display
    = 'none';\n            }\n        }\n        \n        async function createASG()
    {\n            const asgName = document.getElementById('asgName').value;\n            const
    instanceType = document.getElementById('instanceType').value;\n            const
    minSize = document.getElementById('minSize').value;\n            const maxSize
    = document.getElementById('maxSize').value;\n            const desiredCapacity
    = document.getElementById('desiredCapacity').value;\n            const targetCapacity
    = document.getElementById('targetCapacity').value;\n            const maxScalingStep
    = document.getElementById('maxScalingStep').value;\n            const minScalingStep
    = document.getElementById('minScalingStep').value;\n            const terminationProtection
    = document.getElementById('terminationProtection').value;\n            const clusterName
    = 'temp-cluster';\n            \n            if (!asgName) {\n                showAlert('Please
    enter ASG name', 'error');\n                return;\n            }\n            if
    (!targetCapacity || !maxScalingStep || !minScalingStep) {\n                showAlert('Please
    fill in all capacity provider settings', 'error');\n                return;\n
    \           }\n            \n            try {\n                const response
    = await fetch('/api/asg/create', {\n                    method: 'POST',\n                    headers:
    {'Content-Type': 'application/json'},\n                    body: JSON.stringify({\n
    \                       asgName, instanceType, minSize, maxSize, desiredCapacity,
    clusterName,\n                        targetCapacity, maxScalingStep, minScalingStep,
    terminationProtection\n                    })\n                });\n                \n
    \               const data = await response.json();\n                \n                if
    (response.ok) {\n                    showAlert('ASG creation started! Tracking
    progress...', 'success');\n                    document.getElementById('asgProgress').style.display
    = 'block';\n                    trackASGCreation(asgName);\n                }
    else {\n                    showAlert('Error: ' + data.error, 'error');\n                }\n
    \           } catch (error) {\n                showAlert('Error: ' + error.message,
    'error');\n            }\n        }\n        \n        async function trackASGCreation(asgName)
    {\n            const statusDiv = document.getElementById('asgStatus');\n            let
    attempts = 0;\n            const maxAttempts = 60;\n            let lastCheck
    = Date.now();\n            \n            statusDiv.innerHTML = '⏳ Step 1/4: Triggering
    GitHub Actions workflow...';\n            \n            const interval = setInterval(async
    () => {\n                attempts++;\n                \n                try {\n
    \                   const response = await fetch(`/api/asg/status/${asgName}`);\n
    \                   const data = await response.json();\n                    \n
    \                   if (data.status === 'active') {\n                        statusDiv.innerHTML
    = `✅ ASG Created Successfully!<br>Instances: ${data.instances}/${data.desired}
    running`;\n                        clearInterval(interval);\n                        showAlert(`ASG
    \"${asgName}\" is ready! Refreshing list...`, 'success');\n                        setTimeout(()
    => {\n                            loadASGs();\n                            document.getElementById('asgProgress').style.display
    = 'none';\n                            document.getElementById('asgName').value
    = '';\n                        }, 2000);\n                    } else {\n                        const
    step = attempts < 10 ? '2/4: Building terraform config...' : \n                                   attempts
    < 30 ? '3/4: Creating AWS resources...' : \n                                   '4/4:
    Launching EC2 instances...';\n                        statusDiv.innerHTML = `⏳
    ${step}<br>Progress: ${attempts}/${maxAttempts} checks`;\n                    }\n
    \                   \n                    // Check if workflow failed (no ASG
    after 2 minutes)\n                    if (attempts > 24 && data.status === 'creating')
    {\n                        statusDiv.innerHTML = '❌ ASG Creation Failed!<br>Check
    <a href=\"https://github.com/alonsalasi/Platform-Engineer-test/actions\" target=\"_blank\"
    style=\"color:white; text-decoration:underline;\">GitHub Actions</a> for error
    details.';\n                        clearInterval(interval);\n                        showAlert('ASG
    creation failed. Check GitHub Actions logs.', 'error');\n                        document.getElementById('asgProgress').style.display
    = 'none';\n                    }\n                    \n                    if
    (attempts >= maxAttempts) {\n                        statusDiv.innerHTML = '⚠️
    Timeout reached. Check <a href=\"https://github.com/alonsalasi/Platform-Engineer-test/actions\"
    target=\"_blank\" style=\"color:white; text-decoration:underline;\">GitHub Actions</a>
    for status.';\n                        clearInterval(interval);\n                        showAlert('ASG
    creation timeout. Check GitHub Actions.', 'error');\n                    }\n                }
    catch (error) {\n                    statusDiv.innerHTML = `⏳ Waiting for ASG
