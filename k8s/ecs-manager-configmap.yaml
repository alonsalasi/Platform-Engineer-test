    from http.server import HTTPServer, BaseHTTPRequestHandler
    import json
    import os
    import requests
    
    GITHUB_TOKEN = os.environ.get('GITHUB_TOKEN')
    GITHUB_REPO = os.environ.get('GITHUB_REPO')
    
    class ECSManagerHandler(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path == '/':
                self.send_response(200)
                self.send_header('Content-type', 'text/html')
                self.send_header('Cache-Control', 'no-cache, no-store, must-revalidate')
                self.send_header('Pragma', 'no-cache')
                self.send_header('Expires', '0')
                self.end_headers()
                with open('/app/index.html', 'rb') as f:
                    self.wfile.write(f.read())
            elif self.path == '/health':
                self.send_response(200)
                self.send_header('Content-type', 'application/json')
                self.end_headers()
                self.wfile.write(json.dumps({'status': 'healthy'}).encode())
            elif self.path == '/api/ecs/list':
                import boto3
                try:
                    ecs = boto3.client('ecs', region_name='us-east-1')
                    response = ecs.list_clusters()
                    clusters = []
                    for arn in response.get('clusterArns', []):
                        name = arn.split('/')[-1]
                        desc = ecs.describe_clusters(clusters=[arn])['clusters'][0]
                        clusters.append({
                            'name': name,
                            'status': desc['status'],
                            'runningTasks': desc['runningTasksCount'],
                            'pendingTasks': desc['pendingTasksCount']
                        })
                    self.send_response(200)
                    self.send_header('Content-type', 'application/json')
                    self.end_headers()
                    self.wfile.write(json.dumps({'clusters': clusters}).encode())
                except Exception as e:
                    self.send_response(500)
                    self.send_header('Content-type', 'application/json')
                    self.end_headers()
                    self.wfile.write(json.dumps({'error': str(e)}).encode())
            elif self.path == '/api/asg/list':
                import boto3
                try:
                    asg = boto3.client('autoscaling', region_name='us-east-1')
                    response = asg.describe_auto_scaling_groups()
                    groups = []
                    for group in response.get('AutoScalingGroups', []):
                        tags = {tag['Key']: tag['Value'] for tag in group.get('Tags', [])}
                        groups.append({
                            'name': group['AutoScalingGroupName'],
                            'minSize': group['MinSize'],
                            'maxSize': group['MaxSize'],
                            'desiredCapacity': group['DesiredCapacity'],
                            'instances': len(group['Instances']),
                            'targetCapacity': tags.get('CapacityProviderTargetCapacity', '80'),
                            'maxScalingStep': tags.get('CapacityProviderMaxScalingStep', '10'),
                            'minScalingStep': tags.get('CapacityProviderMinScalingStep', '1'),
                            'terminationProtection': tags.get('CapacityProviderTerminationProtection', 'DISABLED')
                        })
                    self.send_response(200)
                    self.send_header('Content-type', 'application/json')
                    self.end_headers()
                    self.wfile.write(json.dumps({'asgs': groups}).encode())
                except Exception as e:
                    self.send_response(500)
                    self.send_header('Content-type', 'application/json')
                    self.end_headers()
                    self.wfile.write(json.dumps({'error': str(e)}).encode())
            elif self.path.startswith('/api/workflow/status'):
                try:
                    response = requests.get(
                        f'https://api.github.com/repos/{GITHUB_REPO}/actions/runs?per_page=5',
                        headers={
                            'Authorization': f'token {GITHUB_TOKEN}',
                            'Accept': 'application/vnd.github.v3+json'
                        }
                    )
                    self.send_response(200)
                    self.send_header('Content-type', 'application/json')
                    self.end_headers()
                    self.wfile.write(response.content)
                except Exception as e:
                    self.send_response(500)
                    self.send_header('Content-type', 'application/json')
                    self.end_headers()
                    self.wfile.write(json.dumps({'error': str(e)}).encode())
            elif self.path.startswith('/api/asg/status/'):
                import boto3
                asg_name = self.path.split('/')[-1]
                try:
                    asg = boto3.client('autoscaling', region_name='us-east-1')
                    response = asg.describe_auto_scaling_groups(AutoScalingGroupNames=[asg_name])
                    if response['AutoScalingGroups']:
                        group = response['AutoScalingGroups'][0]
                        self.send_response(200)
                        self.send_header('Content-type', 'application/json')
                        self.end_headers()
                        self.wfile.write(json.dumps({
                            'status': 'active',
                            'instances': len(group['Instances']),
                            'desired': group['DesiredCapacity']
                        }).encode())
                    else:
                        self.send_response(200)
                        self.send_header('Content-type', 'application/json')
                        self.end_headers()
                        self.wfile.write(json.dumps({'status': 'not_found'}).encode())
                except Exception as e:
                    self.send_response(200)
                    self.send_header('Content-type', 'application/json')
                    self.end_headers()
                    self.wfile.write(json.dumps({'status': 'not_found'}).encode())
            else:
                self.send_response(404)
                self.end_headers()
        
        def do_POST(self):
            if self.path == '/api/asg/create':
                content_length = int(self.headers['Content-Length'])
                body = self.rfile.read(content_length)
                data = json.loads(body.decode())
                
                webhook_url = f'https://api.github.com/repos/{GITHUB_REPO}/dispatches'
                payload = {
                    'event_type': 'create-asg',
                    'client_payload': {
                        'asgName': data.get('asgName'),
                        'instanceType': data.get('instanceType'),
                        'minSize': data.get('minSize'),
                        'maxSize': data.get('maxSize'),
                        'desiredCapacity': data.get('desiredCapacity'),
                        'clusterName': data.get('clusterName'),
                        'targetCapacity': data.get('targetCapacity'),
                        'maxScalingStep': data.get('maxScalingStep'),
                        'minScalingStep': data.get('minScalingStep'),
                        'terminationProtection': data.get('terminationProtection')
                    }
                }
                
                response = requests.post(
                    webhook_url,
                    headers={
                        'Authorization': f'token {GITHUB_TOKEN}',
                        'Accept': 'application/vnd.github.v3+json'
                    },
                    json=payload
                )
                
                if response.status_code == 204:
                    self.send_response(200)
                    self.send_header('Content-type', 'application/json')
                    self.end_headers()
                    self.wfile.write(json.dumps({
                        'message': 'ASG creation triggered',
                        'status': 'pending'
                    }).encode())
                else:
                    print(f'GitHub API Error: {response.status_code} - {response.text}')
                    self.send_response(500)
                    self.send_header('Content-type', 'application/json')
                    self.end_headers()
                    self.wfile.write(json.dumps({
                        'error': f'GitHub API {response.status_code}: {response.text}'
                    }).encode())
            
            elif self.path == '/api/asg/delete':
                content_length = int(self.headers['Content-Length'])
                body = self.rfile.read(content_length)
                data = json.loads(body.decode())
                
                webhook_url = f'https://api.github.com/repos/{GITHUB_REPO}/dispatches'
                payload = {
                    'event_type': 'delete-asg',
                    'client_payload': {
                        'asgName': data.get('asgName'),
                        'user': 'k8s-platform'
                    }
                }
                
                response = requests.post(
                    webhook_url,
                    headers={
                        'Authorization': f'token {GITHUB_TOKEN}',
                        'Accept': 'application/vnd.github.v3+json'
                    },
                    json=payload
                )
                
                if response.status_code == 204:
                    self.send_response(200)
                    self.send_header('Content-type', 'application/json')
                    self.end_headers()
                    self.wfile.write(json.dumps({
                        'message': 'ASG deletion triggered',
                        'status': 'pending'
                    }).encode())
                else:
                    print(f'GitHub API Error: {response.status_code} - {response.text}')
                    self.send_response(500)
                    self.send_header('Content-type', 'application/json')
                    self.end_headers()
                    self.wfile.write(json.dumps({
                        'error': f'GitHub API {response.status_code}: {response.text}'
                    }).encode())
            
            elif self.path == '/api/ecs/create':
                content_length = int(self.headers['Content-Length'])
                body = self.rfile.read(content_length)
                data = json.loads(body.decode())
                
                # Trigger GitHub Actions
                webhook_url = f'https://api.github.com/repos/{GITHUB_REPO}/dispatches'
                payload = {
                    'event_type': 'create-ecs-cluster',
                    'client_payload': {
                        'clusterName': data.get('clusterName'),
                        'capacityProvider': data.get('capacityProvider'),
                        'containerInsights': data.get('containerInsights'),
                        'asgName': data.get('asgName'),
                        'targetCapacity': data.get('targetCapacity'),
                        'maxScalingStep': data.get('maxScalingStep'),
                        'minScalingStep': data.get('minScalingStep'),
                        'terminationProtection': data.get('terminationProtection')
                    }
                }
                
                response = requests.post(
                    webhook_url,
                    headers={
                        'Authorization': f'token {GITHUB_TOKEN}',
                        'Accept': 'application/vnd.github.v3+json'
                    },
                    json=payload
                )
                
                if response.status_code == 204:
                    self.send_response(200)
                    self.send_header('Content-type', 'application/json')
                    self.end_headers()
                    self.wfile.write(json.dumps({
                        'message': 'GitHub Actions triggered',
                        'status': 'pending'
                    }).encode())
                else:
                    print(f'GitHub API Error: {response.status_code} - {response.text}')
                    self.send_response(500)
                    self.send_header('Content-type', 'application/json')
                    self.end_headers()
                    self.wfile.write(json.dumps({
                        'error': f'GitHub API {response.status_code}: {response.text}'
                    }).encode())
            
            elif self.path == '/api/ecs/update':
                content_length = int(self.headers['Content-Length'])
                body = self.rfile.read(content_length)
                data = json.loads(body.decode())
                
                # Trigger GitHub Actions
                webhook_url = f'https://api.github.com/repos/{GITHUB_REPO}/dispatches'
                payload = {
                    'event_type': 'update-ecs-cluster',
                    'client_payload': {
                        'clusterName': data.get('clusterName'),
                        'containerInsights': data.get('containerInsights'),
                        'user': 'k8s-platform'
                    }
                }
                
                response = requests.post(
                    webhook_url,
                    headers={
                        'Authorization': f'token {GITHUB_TOKEN}',
                        'Accept': 'application/vnd.github.v3+json'
                    },
                    json=payload
                )
                
                if response.status_code == 204:
                    self.send_response(200)
                    self.send_header('Content-type', 'application/json')
                    self.end_headers()
                    self.wfile.write(json.dumps({
                        'message': 'GitHub Actions triggered',
                        'status': 'pending'
                    }).encode())
                else:
                    print(f'GitHub API Error: {response.status_code} - {response.text}')
                    self.send_response(500)
                    self.send_header('Content-type', 'application/json')
                    self.end_headers()
                    self.wfile.write(json.dumps({
                        'error': f'GitHub API {response.status_code}: {response.text}'
                    }).encode())
            
            elif self.path == '/api/ecs/delete':
                content_length = int(self.headers['Content-Length'])
                body = self.rfile.read(content_length)
                data = json.loads(body.decode())
                
                # Trigger GitHub Actions
                webhook_url = f'https://api.github.com/repos/{GITHUB_REPO}/dispatches'
                payload = {
                    'event_type': 'delete-ecs-cluster',
                    'client_payload': {
                        'clusterName': data.get('clusterName'),
                        'user': 'k8s-platform'
                    }
                }
                
                response = requests.post(
                    webhook_url,
                    headers={
                        'Authorization': f'token {GITHUB_TOKEN}',
                        'Accept': 'application/vnd.github.v3+json'
                    },
                    json=payload
                )
                
                if response.status_code == 204:
                    self.send_response(200)
                    self.send_header('Content-type', 'application/json')
                    self.end_headers()
                    self.wfile.write(json.dumps({
                        'message': 'GitHub Actions triggered',
                        'status': 'pending'
                    }).encode())
                else:
                    self.send_response(500)
                    self.send_header('Content-type', 'application/json')
                    self.end_headers()
                    self.wfile.write(json.dumps({
                        'error': 'Failed to trigger GitHub Actions'
                    }).encode())
            else:
                self.send_response(404)
                self.end_headers()
    
    if __name__ == '__main__':
        server = HTTPServer(('0.0.0.0', 8080), ECSManagerHandler)
        print('ECS Manager running on port 8080...')
        server.serve_forever()
  
