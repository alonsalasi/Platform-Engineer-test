    <body>
        <div class="container">
            <div class="header">
                <h1>🚀 ECS Platform Manager</h1>
                <span class="badge">Kubernetes IDP</span>
            </div>
            
            <div id="alerts" style="position:fixed; top:20px; right:20px; z-index:2000; max-width:400px;"></div>
            
            <div class="card">
                <h2>📊 Active Clusters</h2>
                <button onclick="loadClusters()" class="btn btn-refresh">🔄 Refresh</button>
                <div id="clustersList"></div>
            </div>
            
            <div class="card">
                <h2>➕ Create ECS Cluster</h2>
                <div class="form-grid">
                    <div class="form-group">
                        <label>Cluster Name</label>
                        <input type="text" id="clusterName" placeholder="my-production-cluster">
                    </div>
                    <div class="form-group">
                        <label>Capacity Provider</label>
                        <select id="capacityProvider" onchange="toggleASGSection()">
                            <option value="FARGATE">AWS Fargate</option>
                            <option value="FARGATE_SPOT">Fargate Spot</option>
                            <option value="EC2">EC2 Instances</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Container Insights</label>
                        <select id="containerInsights">
                            <option value="disabled">Disabled (Free)</option>
                            <option value="enabled">Enabled (Paid)</option>
                        </select>
                    </div>
                </div>
                
                <div id="asgSection" style="display:none; margin-top:20px;">
                    <div class="form-group">
                        <label>Select Auto Scaling Group</label>
                        <select id="asgChoice" style="width:100%;">
                            <option value="">Loading ASGs...</option>
                        </select>
                        <button onclick="loadASGs()" class="btn btn-refresh" style="margin-top:10px; padding:8px 16px; font-size:0.9em;">🔄 Refresh ASG List</button>
                    </div>
                    
                    <h3 style="color:#333; font-size:1.1em; margin:20px 0 15px 0; padding-top:20px; border-top:2px solid #e0e0e0;">Capacity Provider Settings *</h3>
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Target Capacity (%) *</label>
                            <input type="number" id="clusterTargetCapacity" value="80" min="1" max="100" required>
                        </div>
                        <div class="form-group">
                            <label>Max Scaling Step *</label>
                            <input type="number" id="clusterMaxScalingStep" value="10" min="1" max="100" required>
                        </div>
                        <div class="form-group">
                            <label>Min Scaling Step *</label>
                            <input type="number" id="clusterMinScalingStep" value="1" min="1" max="10" required>
                        </div>
                    </div>
                    <div class="form-group" style="margin-top:10px;">
                        <label>Termination Protection *</label>
                        <select id="clusterTerminationProtection" required>
                            <option value="DISABLED">Disabled (Allow scale-down)</option>
                            <option value="ENABLED">Enabled (Prevent termination)</option>
                        </select>
                    </div>
                </div>
                
                <button onclick="createCluster()" class="btn btn-primary" style="margin-top:20px;">🚀 Deploy Cluster via GitOps</button>
            </div>
            
            <div class="card">
                <h2>➕ Create Auto Scaling Group</h2>
                <p style="color:#666; margin-bottom:20px;">Create ASGs for EC2-based ECS clusters.</p>
                
                <div class="form-grid">
                    <div class="form-group">
                        <label>ASG Name</label>
                        <input type="text" id="asgName" placeholder="my-ecs-asg">
                    </div>
                    <div class="form-group">
                        <label>Instance Type</label>
                        <select id="instanceType">
                            <option value="t3.micro">t3.micro (2 vCPU, 1GB RAM)</option>
                            <option value="t3.small">t3.small (2 vCPU, 2GB RAM)</option>
                            <option value="t3.medium">t3.medium (2 vCPU, 4GB RAM)</option>
                            <option value="t3.large">t3.large (2 vCPU, 8GB RAM)</option>
                        </select>
                    </div>
                </div>
                
                <div class="form-grid" style="margin-top:10px;">
                    <div class="form-group">
                        <label>Min Size</label>
                        <input type="number" id="minSize" value="1" min="0" max="10">
                    </div>
                    <div class="form-group">
                        <label>Max Size</label>
                        <input type="number" id="maxSize" value="3" min="1" max="10">
                    </div>
                    <div class="form-group">
                        <label>Desired Capacity</label>
                        <input type="number" id="desiredCapacity" value="2" min="0" max="10">
                    </div>
                </div>
                
                <h3 style="color:#333; font-size:1.1em; margin:25px 0 15px 0; padding-top:20px; border-top:2px solid #e0e0e0;">Capacity Provider Settings</h3>
                <p style="color:#666; font-size:0.9em; margin-bottom:15px;">Configure auto-scaling behavior for ECS tasks</p>
                
                <div class="form-grid">
                    <div class="form-group">
                        <label>Target Capacity (%) *</label>
                        <input type="number" id="targetCapacity" value="80" min="1" max="100" required>
                        <small style="color:#999; font-size:0.85em;">Keep instances at this % utilization</small>
                    </div>
                    <div class="form-group">
                        <label>Max Scaling Step *</label>
                        <input type="number" id="maxScalingStep" value="10" min="1" max="100" required>
                        <small style="color:#999; font-size:0.85em;">Max instances to add at once</small>
                    </div>
                    <div class="form-group">
                        <label>Min Scaling Step *</label>
                        <input type="number" id="minScalingStep" value="1" min="1" max="10" required>
                        <small style="color:#999; font-size:0.85em;">Min instances to add at once</small>
                    </div>
                </div>
                
                <div class="form-group" style="margin-top:10px;">
                    <label>Termination Protection</label>
                    <select id="terminationProtection">
                        <option value="DISABLED">Disabled (Allow scale-down)</option>
                        <option value="ENABLED">Enabled (Prevent termination)</option>
                    </select>
                </div>
                
                <button onclick="createASG()" class="btn btn-primary" style="margin-top:20px;">🚀 Create ASG via GitOps</button>
            </div>
            
            <div class="card">
                <h2>🗑️ Delete Auto Scaling Group</h2>
                <p style="color:#666; margin-bottom:20px;">Remove existing ASGs and terminate all EC2 instances.</p>
                <div style="display:flex; gap:10px; align-items:flex-end;">
                    <div class="form-group" style="flex:1;">
                        <label>Select ASG to Delete</label>
                        <select id="asgDeleteChoice" style="width:100%;">
                            <option value="">Loading ASGs...</option>
                        </select>
                    </div>
                    <button onclick="loadASGs()" class="btn btn-refresh" style="padding:12px 24px;">🔄 Refresh</button>
                    <button onclick="deleteASG()" class="btn btn-delete" style="padding:12px 24px;">🗑️ Delete ASG</button>
                </div>
            </div>
            
            <div id="progressTracker" style="display:none; position:fixed; bottom:20px; right:20px; width:450px; background:rgba(255,255,255,0.98); backdrop-filter:blur(10px); border-radius:15px; box-shadow:0 10px 40px rgba(0,0,0,0.3); z-index:1500; border:3px solid #667eea; opacity:0; transform:scale(0.8); transition:opacity 0.4s ease, transform 0.4s ease;">
                <div style="background:linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding:15px 20px; border-radius:12px 12px 0 0; display:flex; justify-content:space-between; align-items:center;">
                    <h3 style="color:white; margin:0; font-size:1.1em;">⚙️ <span id="progressTitle">Operation Progress</span></h3>
                    <button onclick="closeProgressTracker()" style="background:rgba(255,255,255,0.2); border:none; color:white; width:28px; height:28px; border-radius:50%; cursor:pointer; font-size:1.2em; font-weight:bold;">×</button>
                </div>
                <div style="padding:20px;">
                    <div id="progressSteps"></div>
                    <div id="progressDetails" style="margin-top:15px; padding:12px; background:#f8f9ff; border-radius:8px; font-size:0.9em; color:#666;"></div>
                    <div id="progressError" style="display:none; margin-top:15px; padding:12px; background:#ffe6e6; border-radius:8px; color:#d32f2f; font-weight:600;"></div>
                </div>
            </div>
        </div>
        
        <div id="editModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:1000; align-items:center; justify-content:center;">
            <div style="background:white; border-radius:20px; padding:40px; max-width:500px; width:90%; box-shadow:0 20px 60px rgba(0,0,0,0.5);">
                <h2 style="margin-bottom:20px; color:#333;">✏️ Edit Cluster Settings</h2>
                <p style="color:#666; margin-bottom:20px;">Cluster: <strong id="editClusterName"></strong></p>
                <div class="form-group">
                    <label>Container Insights</label>
                    <select id="editInsights" style="width:100%;">
                        <option value="disabled">Disabled (Free)</option>
                        <option value="enabled">Enabled (Paid)</option>
                    </select>
                </div>
                <div style="display:flex; gap:10px; margin-top:30px;">
                    <button onclick="applyEdit()" class="btn btn-primary" style="flex:1;">✔️ Apply Changes</button>
                    <button onclick="closeEditModal()" class="btn" style="flex:1; background:#e0e0e0; color:#333;">❌ Cancel</button>
                </div>
            </div>
        </div>
        
        <script>
            async function loadClusters() {
                const list = document.getElementById('clustersList');
                list.innerHTML = '<div class="empty-state"><div class="loading"></div> Refreshing clusters...</div>';
                
                try {
                    const response = await fetch('/api/ecs/list');
                    const data = await response.json();
                    
                    if (data.clusters && data.clusters.length > 0) {
                        list.innerHTML = '<table><thead><tr><th>Cluster Name</th><th>Status</th><th>Running Tasks</th><th>Pending Tasks</th><th>Actions</th></tr></thead><tbody>' +
                            data.clusters.map(c => `<tr><td><strong>${c.name}</strong></td><td>${c.status}</td><td>${c.runningTasks}</td><td>${c.pendingTasks}</td><td><div class="actions"><button onclick="editCluster('${c.name}')" class="btn btn-edit">✏️ Edit</button><button onclick="deleteCluster('${c.name}')" class="btn btn-delete">🗑️ Delete</button></div></td></tr>`).join('') +
                            '</tbody></table>';
                    } else {
                        list.innerHTML = '<div class="empty-state">📦 No clusters found. Create your first cluster below!</div>';
                    }
                } catch (error) {
                    list.innerHTML = '<p style="color:red;">Error loading clusters</p>';
                }
            }
            
            window.onload = () => {
                loadClusters();
                loadASGs();
                setInterval(loadClusters, 30000);
            };
            
            let asgData = [];
            
            async function loadASGs() {
                try {
                    const response = await fetch('/api/asg/list');
                    const data = await response.json();
                    asgData = data.asgs || [];
                    const select = document.getElementById('asgChoice');
                    const deleteSelect = document.getElementById('asgDeleteChoice');
                    
                    if (asgData.length > 0) {
                        const options = asgData.map(a => `<option value="${a.name}">${a.name} (${a.instances} instances)</option>`).join('');
                        select.innerHTML = '<option value="">-- Select Existing ASG --</option>' + options;
                        deleteSelect.innerHTML = '<option value="">-- Select ASG to Delete --</option>' + options;
                        select.onchange = () => fillCapacityProviderSettings();
                    } else {
                        select.innerHTML = '<option value="">No ASGs available - Create one below</option>';
                        deleteSelect.innerHTML = '<option value="">No ASGs available</option>';
                    }
                    
                } catch (error) {
                    const select = document.getElementById('asgChoice');
                    const deleteSelect = document.getElementById('asgDeleteChoice');
                    select.innerHTML = '<option value="">⚠️ Error loading ASGs</option>';
                    deleteSelect.innerHTML = '<option value="">⚠️ Error loading ASGs</option>';
                }
            }
            
            function fillCapacityProviderSettings() {
                const asgName = document.getElementById('asgChoice').value;
                const asg = asgData.find(a => a.name === asgName);
                if (asg) {
                    document.getElementById('clusterTargetCapacity').value = asg.targetCapacity;
                    document.getElementById('clusterMaxScalingStep').value = asg.maxScalingStep;
                    document.getElementById('clusterMinScalingStep').value = asg.minScalingStep;
                    document.getElementById('clusterTerminationProtection').value = asg.terminationProtection;
                }
            }
            
            function toggleASGSection() {
                const provider = document.getElementById('capacityProvider').value;
                const section = document.getElementById('asgSection');
                
                if (provider === 'EC2') {
                    section.style.display = 'block';
                    loadASGs();
                } else {
                    section.style.display = 'none';
                }
            }
            
            async function createASG() {
                const asgName = document.getElementById('asgName').value;
                const instanceType = document.getElementById('instanceType').value;
                const minSize = document.getElementById('minSize').value;
                const maxSize = document.getElementById('maxSize').value;
                const desiredCapacity = document.getElementById('desiredCapacity').value;
                const targetCapacity = document.getElementById('targetCapacity').value;
                const maxScalingStep = document.getElementById('maxScalingStep').value;
                const minScalingStep = document.getElementById('minScalingStep').value;
                const terminationProtection = document.getElementById('terminationProtection').value;
                const clusterName = 'temp-cluster';
                
                if (!asgName) {
                    showAlert('Please enter ASG name', 'error');
                    return;
                }
                if (!targetCapacity || !maxScalingStep || !minScalingStep) {
                    showAlert('Please fill in all capacity provider settings', 'error');
                    return;
                }
                
                try {
                    const response = await fetch('/api/asg/create', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({
                            asgName, instanceType, minSize, maxSize, desiredCapacity, clusterName,
                            targetCapacity, maxScalingStep, minScalingStep, terminationProtection
                        })
                    });
                    
                    const data = await response.json();
                    
                    if (response.ok) {
                        showAlert('ASG creation started! Tracking progress...', 'success');
                        showProgressTracker('Creating ASG', 'create-asg', asgName);
                    } else {
                        showAlert('Error: ' + data.error, 'error');
                    }
                } catch (error) {
                    showAlert('Error: ' + error.message, 'error');
                }
            }
            
            let progressInterval = null;
            
            function showProgressTracker(title, operation, resourceName) {
                const tracker = document.getElementById('progressTracker');
                document.getElementById('progressTitle').textContent = title;
                tracker.style.display = 'block';
                setTimeout(() => {
                    tracker.style.opacity = '1';
                    tracker.style.transform = 'scale(1)';
                }, 10);
                trackWorkflowProgress(operation, resourceName);
            }
            
            function closeProgressTracker() {
                const tracker = document.getElementById('progressTracker');
                tracker.style.opacity = '0';
                tracker.style.transform = 'scale(0.7)';
                setTimeout(() => tracker.style.display = 'none', 400);
                if (progressInterval) clearInterval(progressInterval);
            }
            
            async function trackWorkflowProgress(operation, resourceName) {
                const stepsDiv = document.getElementById('progressSteps');
                const detailsDiv = document.getElementById('progressDetails');
                const errorDiv = document.getElementById('progressError');
                let attempts = 0;
                const maxAttempts = 60;
                let workflowFound = false;
                
                const steps = {
                    'create-asg': ['Validate', 'Build Config', 'Terraform Plan', 'Deploy to AWS', 'Verify'],
                    'delete-asg': ['Validate', 'Build Config', 'Terraform Plan', 'Deploy to AWS', 'Verify'],
                    'create-ecs-cluster': ['Validate', 'Build Config', 'Terraform Plan', 'Deploy to AWS', 'Verify'],
                    'delete-ecs-cluster': ['Validate', 'Build Config', 'Terraform Plan', 'Deploy to AWS', 'Verify']
                };
                
                const stepNames = steps[operation] || ['Processing'];
                
                function renderSteps(currentStep, status) {
                    return stepNames.map((step, idx) => {
                        const icon = idx < currentStep ? '✅' : idx === currentStep ? (status === 'in_progress' ? '⏳' : status === 'failure' ? '❌' : '⏳') : '⚪';
                        const color = idx < currentStep ? '#00b894' : idx === currentStep ? '#667eea' : '#ccc';
                        return `<div style="display:flex; align-items:center; gap:10px; margin-bottom:10px;"><span style="font-size:1.5em;">${icon}</span><span style="color:${color}; font-weight:600;">${step}</span></div>`;
                    }).join('');
                }
                
                stepsDiv.innerHTML = renderSteps(-1, 'queued');
                detailsDiv.innerHTML = '🔍 Searching for workflow run...';
                errorDiv.style.display = 'none';
                
                if (progressInterval) clearInterval(progressInterval);
                
                progressInterval = setInterval(async () => {
                    attempts++;
                    
                    try {
                        const response = await fetch('/api/workflow/status');
                        const data = await response.json();
                        
                        if (data.workflow_runs && data.workflow_runs.length > 0) {
                            const run = data.workflow_runs[0];
                            const status = run.status;
                            const conclusion = run.conclusion;
                            
                            workflowFound = true;
                            
                            if (status === 'queued') {
                                stepsDiv.innerHTML = renderSteps(0, 'queued');
                                detailsDiv.innerHTML = `⏳ Workflow queued. Waiting for runner...<br>Attempt: ${attempts}/${maxAttempts}`;
                            } else if (status === 'in_progress') {
                                const elapsed = Math.floor((new Date() - new Date(run.created_at)) / 1000);
                                const currentStep = Math.min(Math.floor(elapsed / 20), stepNames.length - 1);
                                stepsDiv.innerHTML = renderSteps(currentStep, 'in_progress');
                                detailsDiv.innerHTML = `⚙️ Workflow running: <strong>${run.name}</strong><br>⏱️ Elapsed: ${elapsed}s | Attempt: ${attempts}/${maxAttempts}<br>🔗 <a href="${run.html_url}" target="_blank" style="color:#667eea;">View on GitHub</a>`;
                            } else if (status === 'completed') {
                                clearInterval(progressInterval);
                                
                                if (conclusion === 'success') {
                                    stepsDiv.innerHTML = renderSteps(stepNames.length, 'success');
                                    detailsDiv.innerHTML = `✅ <strong>Operation completed successfully!</strong><br>Resource: ${resourceName}<br>🔗 <a href="${run.html_url}" target="_blank" style="color:#667eea;">View workflow</a><br><br><em style="color:#999; font-size:0.9em;">Click the × button to dismiss</em>`;
                                    showAlert(`${resourceName} operation completed successfully!`, 'success');
                                    loadClusters();
                                    loadASGs();
                                } else {
                                    const failedStep = Math.floor(stepNames.length / 2);
                                    stepsDiv.innerHTML = renderSteps(failedStep, 'failure');
                                    errorDiv.style.display = 'block';
                                    errorDiv.innerHTML = `❌ <strong>Workflow failed!</strong><br>Conclusion: ${conclusion}<br>🔗 <a href="${run.html_url}" target="_blank" style="color:#d32f2f; text-decoration:underline;">View error logs on GitHub</a>`;
                                    detailsDiv.innerHTML = `Check the GitHub Actions logs for detailed error information.`;
                                    showAlert(`Operation failed. Check GitHub Actions logs.`, 'error');
                                }
                            }
                        } else if (!workflowFound && attempts > 5) {
                            detailsDiv.innerHTML = `⚠️ No workflow found yet. GitHub may be processing the trigger...<br>Attempt: ${attempts}/${maxAttempts}`;
                        }
                        
                        if (attempts >= maxAttempts) {
                            clearInterval(progressInterval);
                            errorDiv.style.display = 'block';
                            errorDiv.innerHTML = `⏱️ <strong>Timeout reached</strong><br>The workflow may still be running. <a href="https://github.com/alonsalasi/Platform-Engineer-test/actions" target="_blank" style="color:#d32f2f; text-decoration:underline;">Check GitHub Actions</a>`;
                            showAlert('Progress tracking timeout. Check GitHub Actions.', 'error');
                        }
                    } catch (error) {
                        detailsDiv.innerHTML = `⚠️ Error fetching workflow status: ${error.message}<br>Attempt: ${attempts}/${maxAttempts}`;
                    }
                }, 5000);
            }
            
            function editCluster(clusterName) {
                document.getElementById('editClusterName').textContent = clusterName;
                document.getElementById('editModal').style.display = 'flex';
            }
            
            function closeEditModal() {
                document.getElementById('editModal').style.display = 'none';
            }
            
            async function applyEdit() {
                const clusterName = document.getElementById('editClusterName').textContent;
                const insights = document.getElementById('editInsights').value;
                
                closeEditModal();
                
                try {
                    const response = await fetch('/api/ecs/update', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({clusterName, containerInsights: insights})
                    });
                    
                    const data = await response.json();
                    
                    if (response.ok) {
                        showAlert('Update triggered! Check GitHub for progress', 'success');
                        setTimeout(loadClusters, 3000);
                    } else {
                        showAlert('Error: ' + data.error, 'error');
                    }
                } catch (error) {
                    showAlert('Failed to update cluster', 'error');
                }
            }
            
            function showAlert(message, type) {
                const alerts = document.getElementById('alerts');
                const alert = document.createElement('div');
                alert.className = `alert alert-${type}`;
                alert.textContent = message;
                alerts.appendChild(alert);
                setTimeout(() => alert.remove(), 5000);
            }
            
            async function createCluster() {
                const clusterName = document.getElementById('clusterName').value;
                const capacityProvider = document.getElementById('capacityProvider').value;
                const containerInsights = document.getElementById('containerInsights').value;
                
                if (!clusterName) {
                    showAlert('Please enter a cluster name', 'error');
                    return;
                }
                
                let payload = {clusterName, capacityProvider, containerInsights};
                
                if (capacityProvider === 'EC2') {
                    const asgChoice = document.getElementById('asgChoice').value;
                    if (!asgChoice) {
                        showAlert('Please create or select an ASG before creating EC2 cluster', 'error');
                        return;
                    }
                    const targetCap = document.getElementById('clusterTargetCapacity').value;
                    const maxStep = document.getElementById('clusterMaxScalingStep').value;
                    const minStep = document.getElementById('clusterMinScalingStep').value;
                    const termProt = document.getElementById('clusterTerminationProtection').value;
                    
                    if (!targetCap || !maxStep || !minStep) {
                        showAlert('Please fill in all capacity provider settings for EC2 cluster', 'error');
                        return;
                    }
                    
                    payload.asgName = asgChoice;
                    payload.targetCapacity = targetCap;
                    payload.maxScalingStep = maxStep;
                    payload.minScalingStep = minStep;
                    payload.terminationProtection = termProt;
                }
                
                try {
                    const response = await fetch('/api/ecs/create', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify(payload)
                    });
                    
                    const data = await response.json();
                    
                    if (response.ok) {
                        showAlert('Cluster creation started! Tracking progress...', 'success');
                        showProgressTracker('Creating Cluster', 'create-ecs-cluster', clusterName);
                    } else {
                        showAlert('Error: ' + data.error, 'error');
                    }
                } catch (error) {
                    showAlert('Error: ' + error.message, 'error');
                }
            }
            
            async function deleteASG() {
                const asgName = document.getElementById('asgDeleteChoice').value;
                
                if (!asgName) {
                    showAlert('Please select an ASG to delete', 'error');
                    return;
                }
                
                if (!confirm(`Are you sure you want to delete ASG "${asgName}"?\n\nThis will terminate all EC2 instances in the group.\n\nThis action cannot be undone.`)) {
                    return;
                }
                
                try {
                    const response = await fetch('/api/asg/delete', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({asgName})
                    });
                    
                    const data = await response.json();
                    
                    if (response.ok) {
                        showAlert('ASG deletion started! Tracking progress...', 'success');
                        showProgressTracker('Deleting ASG', 'delete-asg', asgName);
                    } else {
                        showAlert('Error: ' + data.error, 'error');
                    }
                } catch (error) {
                    showAlert('Error: ' + error.message, 'error');
                }
            }
            
            async function deleteCluster(clusterName) {
                if (!confirm(`Are you sure you want to delete cluster "${clusterName}"?\n\nThis action cannot be undone.`)) {
                    return;
                }
                
                try {
                    const response = await fetch('/api/ecs/delete', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({clusterName})
                    });
                    
                    const data = await response.json();
                    
                    if (response.ok) {
                        showAlert('Cluster deletion started! Tracking progress...', 'success');
                        showProgressTracker('Deleting Cluster', 'delete-ecs-cluster', clusterName);
                    } else {
                        showAlert('Error: ' + data.error, 'error');
                    }
                } catch (error) {
                    showAlert('Error: ' + error.message, 'error');
                }
            }
        </script>
    </body>
    </html>
