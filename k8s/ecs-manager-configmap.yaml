            .btn-primary {
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                color: white;
            }
            .btn-refresh {
                background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
                color: white;
            }
            .btn-edit {
                background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
                color: white;
